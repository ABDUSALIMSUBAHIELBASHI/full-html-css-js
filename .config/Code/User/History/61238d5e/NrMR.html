<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        .container{
            height: 100vh;
            position: relative;
        }
        .box1{
           width: 200px;
           height:200px ; 
           border: 2px solid red;
           position: absolute;
           top: 0px;
           left: 0px;
        }
           .box2{
           width: 200px;
           height:200px ; 
           border: 2px solid red;
           position: absolute;
           top: 0px;
           right: 0px;
        }
             .box3{
           width: 200px;
           height:200px ; 
           border: 2px solid red;
           position: absolute;
           left: 0px;
           bottom: 0px;
        }
             .box4{
           width: 200px;
           height:200px ; 
           border: 2px solid red;
           position: absolute;
           right: 0px;
           bottom: 0px;
        }
             .box5{
           width: 200px;
           height:200px ; 
           border: 2px solid red;
           position: absolute;
           top: 50%;
          left: 50%;
          transform: translate(-50%, -50%);
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="container">

        <div class="box1">box1</div>
        <div class="box2">box2</div>
        <div class="box3">box3</div>
        <div class="box4">box4</div>
        <div class="box5">box5</div>
    </div>
    <p>lore90</p>
</body>
</html>
